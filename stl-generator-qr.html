<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STL генератор с QR-кодом</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .main-content {
            display: flex;
            gap: 30px;
            padding: 30px;
        }
        
        .controls {
            flex: 1;
            min-width: 350px;
        }
        
        .preview-container {
            flex: 2;
            min-height: 500px;
            background: #f5f5f5;
            border-radius: 10px;
            position: relative;
        }
        
        #canvas-container {
            width: 100%;
            height: 500px;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .control-group {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .control-group h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .input-group {
            flex: 1;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 0.9em;
            font-weight: 500;
        }
        
        input[type="number"],
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus,
        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-download {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }
        
        .btn-download:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .radio-group {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .radio-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        
        .radio-group input[type="radio"] {
            margin-right: 5px;
        }
        
        .alignment-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 10px;
        }
        
        .alignment-btn {
            padding: 8px;
            background: #e0e0e0;
            border: 2px solid transparent;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .alignment-btn:hover {
            background: #d0d0d0;
        }
        
        .alignment-btn.active {
            background: #667eea;
            color: white;
            border-color: #764ba2;
        }
        
        #qrCanvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 STL Генератор с QR-кодом</h1>
            <p>Создайте 3D модель с встроенным QR-кодом и текстом</p>
        </div>
        
        <div class="main-content">
            <div class="controls">
                <div class="control-group">
                    <h3>📐 Размеры основного блока (мм)</h3>
                    <div class="input-row">
                        <div class="input-group">
                            <label>Ширина:</label>
                            <input type="number" id="width" value="100" min="10" max="500">
                        </div>
                        <div class="input-group">
                            <label>Высота:</label>
                            <input type="number" id="height" value="60" min="10" max="500">
                        </div>
                        <div class="input-group">
                            <label>Толщина:</label>
                            <input type="number" id="depth" value="5" min="1" max="50">
                        </div>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3>📝 Текст и QR-код</h3>
                    <label>Текст для QR-кода и отображения:</label>
                    <textarea id="text" placeholder="Введите текст...">8FEEAF
CDE8E</textarea>
                    <div class="input-row" style="margin-top: 10px;">
                        <div class="input-group">
                            <label>Размер шрифта:</label>
                            <input type="number" id="fontSize" value="12" min="4" max="50">
                        </div>
                        <div class="input-group">
                            <label>Глубина гравировки:</label>
                            <input type="number" id="engravingDepth" value="2" min="0.5" max="10" step="0.5">
                        </div>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3>🎨 Расположение элементов</h3>
                    <label>Позиция QR-кода:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="qrPosition" value="left" checked> Слева</label>
                        <label><input type="radio" name="qrPosition" value="right"> Справа</label>
                        <label><input type="radio" name="qrPosition" value="top"> Сверху</label>
                        <label><input type="radio" name="qrPosition" value="bottom"> Снизу</label>
                    </div>
                    
                    <label style="margin-top: 10px;">Выравнивание текста:</label>
                    <div class="alignment-grid">
                        <button class="alignment-btn" data-align="top-left">↖</button>
                        <button class="alignment-btn" data-align="top-center">↑</button>
                        <button class="alignment-btn" data-align="top-right">↗</button>
                        <button class="alignment-btn" data-align="middle-left">←</button>
                        <button class="alignment-btn active" data-align="middle-center">●</button>
                        <button class="alignment-btn" data-align="middle-right">→</button>
                        <button class="alignment-btn" data-align="bottom-left">↙</button>
                        <button class="alignment-btn" data-align="bottom-center">↓</button>
                        <button class="alignment-btn" data-align="bottom-right">↘</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3>📏 Отступы (мм)</h3>
                    <div class="input-row">
                        <div class="input-group">
                            <label>QR-код от края:</label>
                            <input type="number" id="qrPadding" value="5" min="0" max="50">
                        </div>
                        <div class="input-group">
                            <label>Текст от края:</label>
                            <input type="number" id="textPadding" value="5" min="0" max="50">
                        </div>
                    </div>
                </div>
                
                <div class="button-group">
                    <button class="btn-generate" onclick="generateModel()">🔄 Генерировать</button>
                    <button class="btn-download" id="downloadBtn" onclick="downloadSTL()" disabled>💾 Скачать STL</button>
                </div>
            </div>
            
            <div class="preview-container">
                <div id="canvas-container"></div>
            </div>
        </div>
    </div>
    
    <canvas id="qrCanvas"></canvas>
    
    <script>
        let scene, camera, renderer, controls;
        let baseBlock, qrMesh, textMesh;
        let currentModel = null;
        let textAlignment = 'middle-center';
        
        // Инициализация Three.js
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);
            
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(150, 150, 150);
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight.position.set(50, 100, 50);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Простые контролы мыши
            setupMouseControls();
            
            animate();
        }
        
        function setupMouseControls() {
            let mouseDown = false;
            let mouseX = 0;
            let mouseY = 0;
            
            renderer.domElement.addEventListener('mousedown', (e) => {
                mouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            
            renderer.domElement.addEventListener('mouseup', () => {
                mouseDown = false;
            });
            
            renderer.domElement.addEventListener('mousemove', (e) => {
                if (!mouseDown) return;
                
                const deltaX = e.clientX - mouseX;
                const deltaY = e.clientY - mouseY;
                
                if (currentModel) {
                    currentModel.rotation.y += deltaX * 0.01;
                    currentModel.rotation.x += deltaY * 0.01;
                }
                
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            
            renderer.domElement.addEventListener('wheel', (e) => {
                const scale = e.deltaY > 0 ? 1.1 : 0.9;
                camera.position.multiplyScalar(scale);
            });
        }
        
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        
        // Генерация QR-кода
        function generateQRCode(text) {
            const canvas = document.getElementById('qrCanvas');
            const size = 256;
            canvas.width = size;
            canvas.height = size;
            
            const qr = new QRCode(canvas, {
                text: text,
                width: size,
                height: size,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
            
            return new Promise((resolve) => {
                setTimeout(() => {
                    const imgData = canvas.querySelector('img').src;
                    resolve(imgData);
                }, 100);
            });
        }
        
        // Создание текстовой геометрии
        function createTextGeometry(text, fontSize, maxWidth, maxHeight) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = 512;
            canvas.height = 512;
            
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'black';
            ctx.font = `bold ${fontSize * 10}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Разбиение текста на строки
            const words = text.split(/\s+/);
            const lines = [];
            let currentLine = '';
            
            for (const word of words) {
                const testLine = currentLine ? `${currentLine} ${word}` : word;
                const metrics = ctx.measureText(testLine);
                
                if (metrics.width > canvas.width * 0.8) {
                    if (currentLine) {
                        lines.push(currentLine);
                        currentLine = word;
                    } else {
                        lines.push(word);
                        currentLine = '';
                    }
                } else {
                    currentLine = testLine;
                }
            }
            
            if (currentLine) {
                lines.push(currentLine);
            }
            
            // Отрисовка текста
            const lineHeight = fontSize * 12;
            const totalHeight = lines.length * lineHeight;
            const startY = (canvas.height - totalHeight) / 2 + lineHeight / 2;
            
            lines.forEach((line, index) => {
                ctx.fillText(line, canvas.width / 2, startY + index * lineHeight);
            });
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }
        
        async function generateModel() {
            // Очистка сцены
            if (currentModel) {
                scene.remove(currentModel);
            }
            
            // Получение параметров
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            const depth = parseFloat(document.getElementById('depth').value);
            const text = document.getElementById('text').value;
            const fontSize = parseFloat(document.getElementById('fontSize').value);
            const engravingDepth = parseFloat(document.getElementById('engravingDepth').value);
            const qrPadding = parseFloat(document.getElementById('qrPadding').value);
            const textPadding = parseFloat(document.getElementById('textPadding').value);
            const qrPosition = document.querySelector('input[name="qrPosition"]:checked').value;
            
            // Создание группы для модели
            currentModel = new THREE.Group();
            
            // Создание основного блока
            const baseGeometry = new THREE.BoxGeometry(width, height, depth);
            const baseMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x888888,
                shininess: 100
            });
            baseBlock = new THREE.Mesh(baseGeometry, baseMaterial);
            currentModel.add(baseBlock);
            
            // Генерация QR-кода
            const qrDataUrl = await generateQRCode(text);
            const qrTexture = new THREE.TextureLoader().load(qrDataUrl);
            
            // Расчет размеров и позиций для QR-кода
            let qrSize, qrX, qrY, textX, textY, textMaxWidth, textMaxHeight;
            
            switch(qrPosition) {
                case 'left':
                    qrSize = Math.min(height - 2 * qrPadding, width * 0.4);
                    qrX = -width/2 + qrPadding + qrSize/2;
                    qrY = 0;
                    textX = qrX + qrSize/2 + textPadding + (width - qrX - qrSize/2 - textPadding * 2) / 2;
                    textY = 0;
                    textMaxWidth = width - qrSize - qrPadding - textPadding * 2;
                    textMaxHeight = height - textPadding * 2;
                    break;
                case 'right':
                    qrSize = Math.min(height - 2 * qrPadding, width * 0.4);
                    qrX = width/2 - qrPadding - qrSize/2;
                    qrY = 0;
                    textX = -width/2 + textPadding + (width - qrSize - qrPadding - textPadding * 2) / 2;
                    textY = 0;
                    textMaxWidth = width - qrSize - qrPadding - textPadding * 2;
                    textMaxHeight = height - textPadding * 2;
                    break;
                case 'top':
                    qrSize = Math.min(width - 2 * qrPadding, height * 0.4);
                    qrX = 0;
                    qrY = height/2 - qrPadding - qrSize/2;
                    textX = 0;
                    textY = qrY - qrSize/2 - textPadding - (height - qrSize - qrPadding - textPadding * 2) / 2;
                    textMaxWidth = width - textPadding * 2;
                    textMaxHeight = height - qrSize - qrPadding - textPadding * 2;
                    break;
                case 'bottom':
                    qrSize = Math.min(width - 2 * qrPadding, height * 0.4);
                    qrX = 0;
                    qrY = -height/2 + qrPadding + qrSize/2;
                    textX = 0;
                    textY = qrY + qrSize/2 + textPadding + (height - qrSize - qrPadding - textPadding * 2) / 2;
                    textMaxWidth = width - textPadding * 2;
                    textMaxHeight = height - qrSize - qrPadding - textPadding * 2;
                    break;
            }
            
            // Создание QR-кода как выдавленной геометрии
            const qrGeometry = new THREE.BoxGeometry(qrSize, qrSize, engravingDepth);
            const qrMaterial = new THREE.MeshPhongMaterial({ 
                map: qrTexture,
                color: 0xffffff
            });
            qrMesh = new THREE.Mesh(qrGeometry, qrMaterial);
            qrMesh.position.set(qrX, qrY, depth/2 - engravingDepth/2);
            currentModel.add(qrMesh);
            
            // Создание текста
            const textTexture = createTextGeometry(text, fontSize, textMaxWidth, textMaxHeight);
            const textGeometry = new THREE.BoxGeometry(textMaxWidth, textMaxHeight, engravingDepth);
            const textMaterial = new THREE.MeshPhongMaterial({ 
                map: textTexture,
                color: 0xffffff,
                transparent: true
            });
            textMesh = new THREE.Mesh(textGeometry, textMaterial);
            
            // Применение выравнивания текста
            const [vAlign, hAlign] = textAlignment.split('-');
            let textOffsetX = 0, textOffsetY = 0;
            
            switch(hAlign) {
                case 'left':
                    textOffsetX = -textMaxWidth/2 + textPadding;
                    break;
                case 'right':
                    textOffsetX = textMaxWidth/2 - textPadding;
                    break;
            }
            
            switch(vAlign) {
                case 'top':
                    textOffsetY = textMaxHeight/2 - textPadding;
                    break;
                case 'bottom':
                    textOffsetY = -textMaxHeight/2 + textPadding;
                    break;
            }
            
            textMesh.position.set(textX + textOffsetX, textY + textOffsetY, depth/2 - engravingDepth/2);
            currentModel.add(textMesh);
            
            // Добавление модели в сцену
            scene.add(currentModel);
            
            // Активация кнопки скачивания
            document.getElementById('downloadBtn').disabled = false;
        }
        
        // Экспорт в STL
        function downloadSTL() {
            if (!currentModel) return;
            
            const vertices = [];
            const normals = [];
            const faces = [];
            let vertexOffset = 0;
            
            currentModel.traverse((child) => {
                if (child instanceof THREE.Mesh) {
                    const geometry = child.geometry;
                    const matrixWorld = child.matrixWorld;
                    
                    const positions = geometry.attributes.position;
                    const normalAttr = geometry.attributes.normal;
                    const index = geometry.index;
                    
                    // Добавление вершин
                    for (let i = 0; i < positions.count; i++) {
                        const vertex = new THREE.Vector3(
                            positions.getX(i),
                            positions.getY(i),
                            positions.getZ(i)
                        );
                        vertex.applyMatrix4(matrixWorld);
                        vertices.push(vertex);
                        
                        const normal = new THREE.Vector3(
                            normalAttr.getX(i),
                            normalAttr.getY(i),
                            normalAttr.getZ(i)
                        );
                        normals.push(normal);
                    }
                    
                    // Добавление граней
                    if (index) {
                        for (let i = 0; i < index.count; i += 3) {
                            faces.push([
                                index.getX(i) + vertexOffset,
                                index.getX(i + 1) + vertexOffset,
                                index.getX(i + 2) + vertexOffset
                            ]);
                        }
                    } else {
                        for (let i = 0; i < positions.count; i += 3) {
                            faces.push([
                                i + vertexOffset,
                                i + 1 + vertexOffset,
                                i + 2 + vertexOffset
                            ]);
                        }
                    }
                    
                    vertexOffset += positions.count;
                }
            });
            
            // Создание STL строки
            let stlString = 'solid model\n';
            
            for (const face of faces) {
                const v1 = vertices[face[0]];
                const v2 = vertices[face[1]];
                const v3 = vertices[face[2]];
                
                const normal = new THREE.Vector3();
                const edge1 = new THREE.Vector3().subVectors(v2, v1);
                const edge2 = new THREE.Vector3().subVectors(v3, v1);
                normal.crossVectors(edge1, edge2).normalize();
                
                stlString += `  facet normal ${normal.x} ${normal.y} ${normal.z}\n`;
                stlString += '    outer loop\n';
                stlString += `      vertex ${v1.x} ${v1.y} ${v1.z}\n`;
                stlString += `      vertex ${v2.x} ${v2.y} ${v2.z}\n`;
                stlString += `      vertex ${v3.x} ${v3.y} ${v3.z}\n`;
                stlString += '    endloop\n';
                stlString += '  endfacet\n';
            }
            
            stlString += 'endsolid model\n';
            
            // Скачивание файла
            const blob = new Blob([stlString], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'model_with_qr.stl';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        // Обработчики выравнивания текста
        document.querySelectorAll('.alignment-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.alignment-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                textAlignment = this.dataset.align;
            });
        });
        
        // Инициализация при загрузке
        window.addEventListener('load', () => {
            init();
            generateModel();
        });
        
        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
